name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy triton -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -rfE --tb=short                   # engine / scheduler / block manager / server on CPU
      - run: TRITON_INTERPRET=1 pytest -q -rfE --tb=short tests/test_kernels.py tests/test_engine.py -k "triton"   # Triton kernels
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t minivllm:ci .
