apiVersion: apps/v1
kind: Deployment
metadata:
  name: minivllm
  labels: { app: minivllm }
spec:
  replicas: 1
  selector:
    matchLabels: { app: minivllm }
  template:
    metadata:
      labels: { app: minivllm }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: server
          image: ghcr.io/example/minivllm:latest
          ports: [{ containerPort: 8000, name: http }]
          env:
            - { name: MODEL_PATH, value: /models/llama-3-8b-instruct }
            - { name: MAX_NUM_SEQS, value: "256" }
          resources:
            limits: { nvidia.com/gpu: 1, memory: 32Gi }
            requests: { nvidia.com/gpu: 1, memory: 16Gi, cpu: "4" }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 180
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-weights }
---
apiVersion: v1
kind: Service
metadata:
  name: minivllm
spec:
  selector: { app: minivllm }
  ports: [{ port: 80, targetPort: http, name: http }]
---
# Scale on queue depth (waiting requests) exported via Prometheus adapter,
# with GPU count as the hard ceiling.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: minivllm
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: minivllm }
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Pods
      pods:
        metric: { name: minivllm_num_requests_waiting }
        target: { type: AverageValue, averageValue: "16" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
